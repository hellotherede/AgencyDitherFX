<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgencyDitherFX benchmark</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 12px monospace; }
      #stage { width: 1280px; height: 720px; position: relative; }
      #stage > div { position: absolute; inset: 0; }
      #log { padding: 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="log"></div>
    <script type="module">
      const STAGE = document.getElementById('stage');

      // ---- deterministic synthetic source -------------------------------
      // A detailed image gives the dither/tone paths realistic entropy.
      function makePattern(w, h) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#7a5cff');
        grad.addColorStop(1, '#0a0a0a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        let s = 12345;
        const rnd = () => ((s = Math.imul(s, 1664525) + 1013904223 >>> 0) / 4294967296);
        for (let i = 0; i < 240; i += 1) {
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = `hsl(${Math.floor(rnd() * 360)} 80% ${20 + rnd() * 60}%)`;
          ctx.beginPath();
          ctx.arc(rnd() * w, rnd() * h, 8 + rnd() * 90, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        return c;
      }

      function makeSmooth(w, h) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#000000');
        grad.addColorStop(1, '#ffffff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        return c;
      }
      const SMOOTH_SOURCE = await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = makeSmooth(960, 540).toDataURL('image/png');
      });

      const PATTERN = makePattern(960, 540);
      const STATIC_SOURCE = await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = PATTERN.toDataURL('image/png');
      });
      // A canvas source reports dynamic:true, so it re-samples every frame.
      // This is the video-like worst case.
      const DYNAMIC_SOURCE = PATTERN;

      // ---- scenarios ----------------------------------------------------
      const BASE = {
        renderer: 'canvas',
        responsive: false,
        cellSize: 6,
        maxCells: 200000,
        maxDpr: 1,
        resolutionScale: 1,
        maxFps: 240,
        immediate: true,
        decorative: true,
        algorithm: 'bayer8'
      };

      const SCENARIOS = [
        { id: 'dots-mono-static',       dynamic: false, opts: { mode: 'dots' } },
        { id: 'dots-mono-video',        dynamic: true,  opts: { mode: 'dots' } },
        { id: 'blocks-mono-video',      dynamic: true,  opts: { mode: 'blocks' } },
        { id: 'ascii-static',           dynamic: false, opts: { mode: 'ascii' } },
        { id: 'ascii-video',            dynamic: true,  opts: { mode: 'ascii' } },
        { id: 'dots-sourcecolor-video', dynamic: true,  opts: { mode: 'dots', colorMode: 'source' } },
        { id: 'dots-palette-video',     dynamic: true,  opts: { mode: 'dots', colorMode: 'palette' } },
        { id: 'raw-dither-video',       dynamic: true,  opts: { mode: 'raw-dither' } },
        { id: 'dots-reveal-50',         dynamic: false, opts: { mode: 'dots', revealProgress: 0.5, stagger: true } },
        { id: 'dots-ambient-video',     dynamic: true,  opts: { mode: 'dots', ambientEnabled: true, ambientAmount: 0.25 } },
        { id: 'hybrid-video',           dynamic: true,  opts: { mode: 'hybrid' } },
        { id: 'floyd-static',           dynamic: false, opts: { mode: 'dots', algorithm: 'floyd-steinberg' } },
        { id: 'stucki-static',          dynamic: false, opts: { mode: 'dots', algorithm: 'stucki' } },
        { id: 'dots-cell12-video',      dynamic: true,  opts: { mode: 'dots', cellSize: 12 } },
        // Same visual configs, routed to the GPU renderer.
        { id: 'gl-dots-mono-static',    dynamic: false, opts: { mode: 'dots', renderer: 'webgl' } },
        { id: 'gl-dots-mono-video',     dynamic: true,  opts: { mode: 'dots', renderer: 'webgl' } },
        { id: 'gl-blocks-mono-video',   dynamic: true,  opts: { mode: 'blocks', renderer: 'webgl' } },
        { id: 'gl-raw-dither-video',    dynamic: true,  opts: { mode: 'raw-dither', renderer: 'webgl' } },
        { id: 'gl-dots-sourcecol-video',dynamic: true,  opts: { mode: 'dots', renderer: 'webgl', colorMode: 'source' } },
        { id: 'gl-dots-cell3-video',    dynamic: true,  opts: { mode: 'dots', renderer: 'webgl', cellSize: 3 } },
        { id: 'dots-cell3-video',       dynamic: true,  opts: { mode: 'dots', cellSize: 3 } },
        // Fragment-bound stress: 9x the pixels of the dpr-1 cases. Shows how
        // much headroom the shader has for extra per-fragment work.
        { id: 'gl-dots-dpr3',           dynamic: true,  opts: { mode: 'dots', renderer: 'webgl', maxDpr: 3 } },
        { id: 'dots-dpr3',              dynamic: true,  opts: { mode: 'dots', maxDpr: 3 } },
        // Motion configurations, which used to force the Canvas renderer.
        { id: 'gl-ambient-video',       dynamic: true,  opts: { mode: 'dots', renderer: 'webgl', ambientEnabled: true, ambientAmount: 0.25 } },
        { id: 'gl-displacement-video',  dynamic: true,  opts: { mode: 'dots', renderer: 'webgl', displacement: 0.4 } },
        { id: 'displacement-video',     dynamic: true,  opts: { mode: 'dots', displacement: 0.4 } },
        { id: 'gl-rotation-video',      dynamic: true,  opts: { mode: 'blocks', renderer: 'webgl', rotation: 30 } },
        { id: 'rotation-video',         dynamic: true,  opts: { mode: 'blocks', rotation: 30 } },
        { id: 'gl-ascii-video',         dynamic: true,  opts: { mode: 'ascii', renderer: 'webgl' } }
      ];

      const median = (a) => {
        const s = [...a].sort((x, y) => x - y);
        return s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
      };
      const pct = (a, p) => {
        const s = [...a].sort((x, y) => x - y);
        return s[Math.min(s.length - 1, Math.floor(s.length * p))];
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function makeHost() {
        const host = document.createElement('div');
        STAGE.append(host);
        // Force layout so ResizeObserver/getBoundingClientRect see real size.
        host.getBoundingClientRect();
        await sleep(0);
        return host;
      }

      // ---- one scenario, one library ------------------------------------
      async function runScenario(Lib, scenario, frames) {
        const host = await makeHost();
        const fx = new Lib.AgencyDitherFX(host, { ...BASE, ...scenario.opts });
        try {
          await fx.setSource(scenario.dynamic ? DYNAMIC_SOURCE : STATIC_SOURCE);
          fx.stop();

          // warmup: JIT + first-frame allocations
          let t = 1000;
          for (let i = 0; i < 25; i += 1) { fx.render(t); t += 16.7; }

          // Canvas2D only *records* draw ops during render(); rasterization is
          // deferred to the raster thread. A 1x1 readback forces the flush, so
          // `flushed` captures record + raster. Both libs pay the same fixed
          // readback overhead, so the comparison stays fair.
          let forceFlush = () => {};
          const flushCtx = fx.canvas.getContext('2d');
          if (flushCtx) {
            forceFlush = () => { flushCtx.getImageData(0, 0, 1, 1); };
          } else {
            const gl = fx.canvas.getContext('webgl');
            if (gl) {
              const px = new Uint8Array(4);
              forceFlush = () => { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
            }
          }

          // ---- metric 1: main-thread CPU cost per render -----------------
          const times = [];
          const flushed = [];
          const sample = [], dith = [], draw = [];
          for (let i = 0; i < frames; i += 1) {
            const a = performance.now();
            fx.render(t);
            const b = performance.now();
            forceFlush();
            const c = performance.now();
            times.push(b - a);
            flushed.push(c - a);
            const st = fx.getStats();
            if (st.sampleMs !== undefined) { sample.push(st.sampleMs); dith.push(st.ditherMs); draw.push(st.drawMs); }
            t += 16.7;
          }

          const stats = fx.getStats();

          // ---- metric 2: live rAF throughput ----------------------------
          // Uncapped-as-possible real loop; vsync still bounds this near 60.
          let rafFrames = 0;
          let liveError = null;
          const liveStart = performance.now();
          await new Promise((resolve) => {
            // A throw inside rAF never rejects, so guard the loop and give it a
            // hard wall-clock deadline; otherwise one bad frame hangs the run.
            const bail = setTimeout(resolve, 8000);
            const done = () => { clearTimeout(bail); resolve(); };
            const step = (now) => {
              try {
                fx.render(now);
              } catch (error) {
                liveError = String(error && error.message ? error.message : error);
                return done();
              }
              rafFrames += 1;
              if (now - liveStart >= 2000) return done();
              requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          });
          const liveMs = performance.now() - liveStart;

          return {
            id: scenario.id,
            cells: stats.cells,
            width: stats.width,
            height: stats.height,
            renderer: stats.renderer,
            warning: stats.warning,
            liveError,
            medianMs: median(times),
            p95Ms: pct(times, 0.95),
            flushedMs: median(flushed),
            meanMs: times.reduce((s, v) => s + v, 0) / times.length,
            capableFps: 1000 / median(flushed),
            liveFps: (rafFrames / liveMs) * 1000,
            sampleMs: sample.length ? median(sample) : null,
            ditherMs: dith.length ? median(dith) : null,
            drawMs: draw.length ? median(draw) : null
          };
        } finally {
          fx.destroy();
          host.remove();
        }
      }

      // ---- driver: interleaved A/B over repeated rounds -------------------
      window.__bench = async ({ frames = 90, rounds = 3, only = null } = {}) => {
        const [A, B] = await Promise.all([
          import('./lib-baseline.js'),
          import('./lib-optimized.js').catch(() => null)
        ]);
        const libs = B ? [['baseline', A], ['optimized', B]] : [['baseline', A]];
        const list = only ? SCENARIOS.filter((s) => only.includes(s.id)) : SCENARIOS;
        const acc = {};

        for (let round = 0; round < rounds; round += 1) {
          for (const scenario of list) {
            // Alternate lib order per round to cancel out ordering bias.
            const order = round % 2 === 0 ? libs : [...libs].reverse();
            for (const [name, Lib] of order) {
              const key = `${scenario.id}::${name}`;
              const result = await runScenario(Lib, scenario, frames);
              (acc[key] ??= []).push(result);
              await sleep(60); // let the compositor settle between runs
            }
          }
        }

        // Take the best (lowest median) round per cell: least noise-contaminated.
        const out = [];
        for (const [key, runs] of Object.entries(acc)) {
          const [id, lib] = key.split('::');
          const best = runs.reduce((a, b) => (a.flushedMs <= b.flushedMs ? a : b));
          out.push({ ...best, id, lib, rounds: runs.length });
        }
        return out;
      };

      // ---- pixel-parity check -------------------------------------------
      // A faster renderer that changes what it draws is a bug, so every
      // scenario is rendered by both builds and compared pixel for pixel.
      async function renderOnce(Lib, scenario) {
        const host = await makeHost();
        const fx = new Lib.AgencyDitherFX(host, { ...BASE, ...scenario.opts });
        try {
          await fx.setSource(scenario.dynamic ? DYNAMIC_SOURCE : STATIC_SOURCE);
          fx.stop();
          for (let i = 0; i < 3; i += 1) fx.render(5000);
          const w = fx.canvas.width, h = fx.canvas.height;
          const ctx = fx.canvas.getContext('2d');
          if (ctx) return { w, h, data: ctx.getImageData(0, 0, w, h).data };
          const gl = fx.canvas.getContext('webgl');
          if (!gl) return null;
          const px = new Uint8Array(w * h * 4);
          gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
          return { w, h, data: px };
        } finally {
          fx.destroy();
          host.remove();
        }
      }

      window.__verify = async ({ only = null } = {}) => {
        const [A, B] = await Promise.all([
          import('./lib-baseline.js'),
          import('./lib-optimized.js')
        ]);
        const list = only ? SCENARIOS.filter((s) => only.includes(s.id)) : SCENARIOS;
        const out = [];
        for (const scenario of list) {
          try {
            const a = await renderOnce(A, scenario);
            const b = await renderOnce(B, scenario);
            if (!a || !b) { out.push({ id: scenario.id, skipped: true }); continue; }
            if (a.w !== b.w || a.h !== b.h) {
              out.push({ id: scenario.id, error: 'size mismatch' });
              continue;
            }
            let maxDiff = 0;
            let sum = 0;
            let differing = 0;
            for (let i = 0; i < a.data.length; i += 1) {
              const d = Math.abs(a.data[i] - b.data[i]);
              if (d > 0) { differing += 1; sum += d; if (d > maxDiff) maxDiff = d; }
            }
            out.push({
              id: scenario.id,
              maxDiff,
              meanDiff: sum / a.data.length,
              pctChannels: (differing / a.data.length) * 100
            });
          } catch (error) {
            out.push({ id: scenario.id, error: String(error && error.message || error) });
          }
        }
        return out;
      };

      // ---- WebGL transparency correctness --------------------------------
      // The shader can output a fully transparent pixel. If the draw is blended
      // over the framebuffer instead of replacing it, a src alpha of 0 leaves
      // the PREVIOUS frame visible, so a reveal animation never clears.
      window.__correctness = async () => {
        const [A, B] = await Promise.all([
          import('./lib-baseline.js'),
          import('./lib-optimized.js')
        ]);
        const out = [];
        for (const [name, Lib] of [['baseline', A], ['optimized', B]]) {
          const host = await makeHost();
          const fx = new Lib.AgencyDitherFX(host, {
            ...BASE,
            mode: 'dots',
            renderer: 'webgl',
            backgroundTransparent: true,
            stagger: false,
            revealProgress: 1
          });
          try {
            await fx.setSource(STATIC_SOURCE);
            fx.stop();
            const gl = fx.canvas.getContext('webgl');
            if (!gl) { out.push({ lib: name, skipped: true }); continue; }

            // Frame 1: fully revealed, so ink is painted across the canvas.
            fx.render(1000);
            const w = fx.canvas.width, h = fx.canvas.height;
            const first = new Uint8Array(w * h * 4);
            gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, first);
            let inkedFirst = 0;
            for (let i = 3; i < first.length; i += 4) if (first[i] > 0) inkedFirst += 1;

            // Frame 2: nothing revealed, so every pixel must be transparent.
            fx.set({ revealProgress: 0 });
            fx.render(1016);
            const second = new Uint8Array(w * h * 4);
            gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, second);
            let residue = 0;
            let maxAlpha = 0;
            for (let i = 3; i < second.length; i += 4) {
              if (second[i] > 0) residue += 1;
              if (second[i] > maxAlpha) maxAlpha = second[i];
            }
            out.push({
              lib: name,
              pixels: w * h,
              inkedFirst,
              residue,
              maxAlpha,
              clean: residue === 0
            });
          } catch (error) {
            out.push({ lib: name, error: String(error && error.message || error) });
          } finally {
            fx.destroy();
            host.remove();
          }
        }
        return out;
      };

      // ---- Canvas vs WebGL divergence ------------------------------------
      // Both renderers claim to draw the same effect. This measures how far
      // apart they actually are on an identical configuration.
      window.__renderers = async () => {
        const Lib = await import('./lib-optimized.js');
        const CONFIGS = [
          // Smooth source + no dither: isolates the tone pipeline and geometry.
          { id: 'smooth-raw-nodith', smooth: true, opts: { mode: 'raw-dither', noiseAmount: 0, ditherAmount: 0 } },
          { id: 'smooth-raw-dith',   smooth: true, opts: { mode: 'raw-dither', noiseAmount: 0 } },
          { id: 'smooth-dots',       smooth: true, opts: { mode: 'dots', noiseAmount: 0 } },
          { id: 'dots-default',   opts: { mode: 'dots' } },
          { id: 'dots-nonoise',   opts: { mode: 'dots', noiseAmount: 0 } },
          { id: 'blocks-nonoise', opts: { mode: 'blocks', noiseAmount: 0 } },
          { id: 'raw-nonoise',    opts: { mode: 'raw-dither', noiseAmount: 0 } },
          // raw-dither has no antialiasing, so this isolates the noise term.
          { id: 'raw-noise',      opts: { mode: 'raw-dither' } },
          { id: 'smooth-raw-noise', smooth: true, opts: { mode: 'raw-dither' } },
          { id: 'dots-flat',      opts: { mode: 'dots', noiseAmount: 0, contrast: 1, ditherAmount: 1 } },
          { id: 'dots-reveal-50', opts: { mode: 'dots', noiseAmount: 0, revealProgress: 0.5 } },
          // Motion paths, newly expressible in the shader.
          { id: 'ambient-drift',   opts: { mode: 'dots', noiseAmount: 0, ambientEnabled: true, ambientAmount: 0.25 } },
          { id: 'ambient-orbit',   opts: { mode: 'dots', noiseAmount: 0, ambientEnabled: true, ambientMode: 'orbit', ambientAmount: 0.3 } },
          { id: 'ambient-pulse',   opts: { mode: 'dots', noiseAmount: 0, ambientEnabled: true, ambientMode: 'pulse', ambientAmount: 0.4 } },
          { id: 'ambient-wave',    opts: { mode: 'dots', noiseAmount: 0, ambientEnabled: true, ambientMode: 'wave', ambientAmount: 0.3 } },
          { id: 'displacement',    opts: { mode: 'dots', noiseAmount: 0, displacement: 0.4 } },
          { id: 'rotation-blocks', opts: { mode: 'blocks', noiseAmount: 0, rotation: 30 } },
          { id: 'ascii',           opts: { mode: 'ascii', noiseAmount: 0 } }
        ];
        const out = [];
        for (const cfg of CONFIGS) {
          const shots = {};
          for (const renderer of ['canvas', 'webgl']) {
            const host = await makeHost();
            const fx = new Lib.AgencyDitherFX(host, {
              ...BASE, ...cfg.opts, renderer, immediate: true
            });
            try {
              await fx.setSource(cfg.smooth ? SMOOTH_SOURCE : STATIC_SOURCE);
              fx.stop();
              fx.render(4000);
              const w = fx.canvas.width, h = fx.canvas.height;
              const ctx = fx.canvas.getContext('2d');
              if (ctx) {
                shots[renderer] = { w, h, data: ctx.getImageData(0, 0, w, h).data, kind: fx.getStats().renderer };
              } else {
                const gl = fx.canvas.getContext('webgl');
                const px = new Uint8Array(w * h * 4);
                gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
                // readPixels is bottom-up; flip to match getImageData order.
                const flipped = new Uint8Array(px.length);
                const stride = w * 4;
                for (let y = 0; y < h; y += 1) {
                  flipped.set(px.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
                }
                shots[renderer] = { w, h, data: flipped, kind: fx.getStats().renderer };
              }
            } finally {
              fx.destroy();
              host.remove();
            }
          }
          const a = shots.canvas, b = shots.webgl;
          let sum = 0, differing = 0, maxDiff = 0;
          // Bucket by magnitude: small deltas are antialiasing on primitive
          // edges, large ones mean a cell is on in one renderer and off in the other.
          let b32 = 0, b64 = 0, b128 = 0;
          // Compare luminance per pixel; ignore alpha so opaque configs compare cleanly.
          for (let i = 0; i < a.data.length; i += 4) {
            const la = (a.data[i] * 0.2126 + a.data[i + 1] * 0.7152 + a.data[i + 2] * 0.0722);
            const lb = (b.data[i] * 0.2126 + b.data[i + 1] * 0.7152 + b.data[i + 2] * 0.0722);
            const d = Math.abs(la - lb);
            if (d > 8) differing += 1;
            if (d > 32) b32 += 1;
            if (d > 64) b64 += 1;
            if (d > 128) b128 += 1;
            sum += d;
            if (d > maxDiff) maxDiff = d;
          }
          const pixels = a.data.length / 4;
          // Sanity check: if the un-flipped comparison scores better, the flip
          // in this harness is backwards and every number above is meaningless.
          let unflipped = 0;
          const stride = a.w * 4;
          for (let y = 0; y < a.h; y += 1) {
            const srcRow = (a.h - 1 - y) * stride;
            for (let x = 0; x < stride; x += 4) {
              const i = y * stride + x;
              const j = srcRow + x;
              const la = (a.data[i] * 0.2126 + a.data[i + 1] * 0.7152 + a.data[i + 2] * 0.0722);
              const lb = (b.data[j] * 0.2126 + b.data[j + 1] * 0.7152 + b.data[j + 2] * 0.0722);
              unflipped += Math.abs(la - lb);
            }
          }
          out.push({
            id: cfg.id,
            actual: `${a.kind}/${b.kind}`,
            meanDiff: sum / pixels,
            meanUnflipped: unflipped / pixels,
            maxDiff,
            pctPixels: (differing / pixels) * 100,
            pct32: (b32 / pixels) * 100,
            pct64: (b64 / pixels) * 100,
            pct128: (b128 / pixels) * 100
          });
        }
        return out;
      };

      // ---- noise readback --------------------------------------------------
      // A flat 50% grey source with ditherAmount 0 and noiseAmount 1 makes
      // raw-dither output exactly the noise value, so it can be compared with
      // the JS hash directly.
      window.__noise = async () => {
        const Lib = await import('./lib-optimized.js');
        const grey = document.createElement('canvas');
        grey.width = 64; grey.height = 64;
        const gctx = grey.getContext('2d');
        gctx.fillStyle = 'rgb(128 128 128)';
        gctx.fillRect(0, 0, 64, 64);
        const GREY = await new Promise((r) => {
          const img = new Image();
          img.onload = () => r(img);
          img.src = grey.toDataURL('image/png');
        });

        const opts = {
          ...BASE, mode: 'raw-dither', renderer: 'webgl', immediate: true,
          noiseAmount: 1, ditherAmount: 0, contrast: 1, brightness: 0,
          gamma: 1, threshold: 0.5, cellSize: 8, fit: 'fill'
        };
        const host = await makeHost();
        const fx = new Lib.AgencyDitherFX(host, opts);
        let result;
        try {
          await fx.setSource(GREY);
          fx.stop();
          fx.render(4000);
          const w = fx.canvas.width, h = fx.canvas.height;
          const gl = fx.canvas.getContext('webgl');
          const px = new Uint8Array(w * h * 4);
          gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
          const stats = fx.getStats();
          const cols = Math.round(stats.cells / Math.round(h / (h / (stats.cells / (w / (w / 1))))));
          // Sample the centre of the first few cells along the top row.
          const cellW = w / Math.round(w / 8);
          const read = [];
          for (let i = 0; i < 8; i += 1) {
            const cx = Math.floor((i + 0.5) * cellW);
            // readPixels is bottom-up: the top row of the image is the last row.
            const cy = h - 1 - Math.floor(0.5 * cellW);
            read.push(px[(cy * w + cx) * 4]);
          }
          result = { read, w, h, cells: stats.cells };
        } finally {
          fx.destroy();
          host.remove();
        }
        return result;
      };

      document.getElementById('log').textContent = 'ready';
      window.__ready = true;
    </script>
